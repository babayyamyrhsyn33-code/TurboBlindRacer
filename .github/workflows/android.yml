name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "No gradlew, creating basic build with gradle"
            # Install gradle if needed via sdk
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboBlindRacer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: List outputs
        run: find . -name "*.apk" || echo "No APK found"
